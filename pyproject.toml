[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unitok-sae-research"
version = "0.1.0"
description = "Composable UniTok and sparse autoencoder research tools"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["torch>=2.11,<3", "torchvision>=0.26,<1", "numpy>=2,<3", "Pillow>=11,<14"]

[project.optional-dependencies]
model = ["timm==1.0.15", "typed-argument-parser==1.12.0", "pytz>=2026", "ftfy==6.3.1", "regex>=2026", "tqdm>=4.67", "huggingface-hub>=1,<3"]


[project.scripts]
unitok-sae = "unitok_sae.__main__:main"

[project.urls]
Repository = "https://github.com/radinshahdaei/unitok-sae-research"

[tool.setuptools.packages.find]
include = ["unitok_sae*"]

[tool.setuptools.package-data]
unitok_sae = ["patches/*.patch", "patches/LICENSE"]
